spring:

  # .env import
  config:
    import: optional:file:./.env[.properties]

  # Database
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASS}
    url: ${DB_URL}

  # Spring Data JPA
  jpa:
    show-sql: 'false'
    hibernate:
      ddl-auto: update
    open-in-view: 'false'
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true # SQL 포맷팅
        highlight_sql: true # ANSI 코드에 색을 나타냄
        use_sql_comments: true # SQL 내부에 /* */ 주석 추가

  #JWT
  jwt:
    secret: ${JWT_SECRET}
    access:
      token:
        expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# logging
logging:
  level:
    org:
      springframework:
        core:
          LocalVariableTableParameterNameDiscoverer: error
      hibernate:
        sql: debug
        type.descriptor.sql: trace # 파라미터 값 추가
        sql.results.internal.ResultsHelper: INFO # OneToMany 조회 관련 로그 숨김
    p6spy:

# p6spy log
decorator:
  datasource:
    p6spy:
      enable-logging: false

# Swagger 설정 추가
springdoc:
  show-login-endpoint: true
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v1/api-docs

kakao:
  api:
    key: ${KAKAO_API_KEY}
  redirect:
    uri: ${KAKAO_REDIRECT_URI}

naver:
  client:
    id: ${NAVER_API_CLIENT_ID}
    secret: ${NAVER_API_CLIENT_SECRET}
  redirect:
    uri: ${NAVER_API_REDIRECT_URI}

cloud:
  aws:
    credentials:
      accessKey: ${ACCESS_KEY}
      secretKey: ${SECRET_KEY}
    region:
      static: ${REGION}
    s3:
      docBucket: ${DOC_BUCKET}
      imgBucket: ${IMG_BUCKET}

server:
  tomcat:
    max-swallow-size: 50MB